services:
  - type: web
    name: calorietrack-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build --workspace=backend
    preDeployCommand: npx prisma migrate deploy --schema=backend/prisma/schema.prisma
    startCommand: npm run start --workspace=backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CORS_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: GOOGLE_CLIENT_ID
        sync: false
